; Default PHP upload_max_filesize = 2M, lebih kecil dari batas validasi
; foto tiket (4 MB). Selaraskan dengan client_max_body_size di nginx.
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 256M
max_execution_time = 60

expose_php = Off

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
